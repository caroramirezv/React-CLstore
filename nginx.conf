server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m;                       # subida de imagenes (hasta 5 MB)

  # Los servicios arman las URLs de las imagenes con estos headers
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;

  location /api/productos/stock/ { return 403; } # solo para llamadas internas entre servicios
  location /api/productos        { proxy_pass http://ms-productos:8081; }
  location /uploads/productos/   { proxy_pass http://ms-productos:8081; }
  location /api/categorias       { proxy_pass http://ms-categoria:8082; }
  location /api/blogs            { proxy_pass http://ms-blogs:8083; }
  location /uploads/blogs/       { proxy_pass http://ms-blogs:8083; }
  location ~ ^/api/(usuarios|auth) { proxy_pass http://ms-usuarios:8084; }
  location /api/carrito          { proxy_pass http://ms-carrito:8085; }
  location /api/ordenes          { proxy_pass http://ms-ordenes:8086; }
  location /api/resenas          { proxy_pass http://ms-resenas:8087; }
  location /api/contactos        { proxy_pass http://ms-contacto:8088; }

  location / { try_files $uri /index.html; }     # necesario para React Router
}
